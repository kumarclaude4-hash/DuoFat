<!DOCTYPE html>
<!--
  DuoShield Watch Together — YouTube IFrame Player host page.

  Loaded by WatchTogetherPlayerView into a WebView via loadDataWithBaseURL with
  base URL https://www.youtube.com so the IFrame API's origin check passes.

  WHY THIS EXISTS
  ---------------
  YouTube's officially supported embedded playback surface for programmatic
  control is the IFrame Player API. It gives exact playVideo / pauseVideo /
  seekTo / setPlaybackRate control plus state callbacks, which is precisely what
  playback synchronization needs. Using it via a local WebView avoids adding any
  third-party Gradle dependency.

  IMPORTANT
  ---------
  The video stream is fetched directly from YouTube by this page, inside each
  participant's own device. It never passes through Firestore and never passes
  through the WebRTC media path. Only small JSON-ish state fields sync.

  BRIDGE CONTRACT (must stay in sync with WatchTogetherPlayerView.java)
  --------------------------------------------------------------------
  Java -> JS (evaluateJavascript):
    WT.cue(videoId, positionMs, playing, rate)
    WT.play()
    WT.pause()
    WT.seek(positionMs)
    WT.setRate(rate)
    WT.stop()
    WT.setVolume(volume0to100)
    WT.mute()
    WT.unMute()

  JS -> Java (@JavascriptInterface on object named DuoShieldWT):
    DuoShieldWT.onPlayerReady()
    DuoShieldWT.onPlayerStateChange(ytState, positionMs)
    DuoShieldWT.onPositionTick(positionMs, playing, rate)
    DuoShieldWT.onPlaybackRateChange(rate)
    DuoShieldWT.onPlayerError(code)
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Watch Together</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #stage, #player, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage"><div id="player"></div></div>

  <script>
    (function () {
      'use strict';

      // Position tick cadence. 500ms is frequent enough for the Java side to hold a
      // fresh local position for drift comparison, without burning battery.
      var TICK_INTERVAL_MS = 500;

      /**
       * Origin declared to the IFrame API. MUST match the base URL
       * WatchTogetherPlayerView loads this page with, or YouTube treats the embed as
       * unattributable and refuses playable videos. See createPlayer().
       */
      var PLAYER_ORIGIN = 'https://www.youtube.com';

      /** Settling time before a rebuilt embed is constructed. See handleError(). */
      var RETRY_DELAY_MS = 400;

      var player = null;
      var ready = false;
      var tickTimer = null;

      // Commands issued by Java before the player finished constructing are stored
      // here and replayed on ready. Without this, a fast Firestore snapshot arriving
      // before onYouTubeIframeAPIReady would be silently dropped.
      var pending = null;

      // Volume/mute requested before the player was ready. Replayed on onReady, in the
      // same spirit as `pending` above: Java attenuates the video the moment it learns the
      // player exists, and that command must not be dropped if it wins the race.
      // null means "nothing was requested", which is distinct from 0 / false.
      var pendingVolume = null;
      var pendingMuted = null;

      /**
       * The most recent cue, and the video a rebuild has already been spent on. Together
       * these bound the retry in handleError() to one attempt per video, so a video that
       * genuinely cannot play here cannot put the page in a rebuild loop.
       */
      var lastCue = null;
      var retriedForVideoId = null;

      function bridge() {
        return (typeof DuoShieldWT !== 'undefined') ? DuoShieldWT : null;
      }

      function safe(fn) {
        try {
          return fn();
        } catch (e) {
          return null;
        }
      }

      function positionMs() {
        if (!player || !player.getCurrentTime) return 0;
        var t = safe(function () { return player.getCurrentTime(); });
        return Math.max(0, Math.round((t || 0) * 1000));
      }

      function currentRate() {
        if (!player || !player.getPlaybackRate) return 1;
        var r = safe(function () { return player.getPlaybackRate(); });
        return (r && r > 0) ? r : 1;
      }

      function isPlaying() {
        if (!player || !player.getPlayerState) return false;
        // 1 === YT.PlayerState.PLAYING
        return safe(function () { return player.getPlayerState(); }) === 1;
      }

      function startTicking() {
        if (tickTimer !== null) return;
        tickTimer = setInterval(function () {
          var b = bridge();
          if (b && b.onPositionTick) {
            safe(function () { b.onPositionTick(positionMs(), isPlaying(), currentRate()); });
          }
        }, TICK_INTERVAL_MS);
      }

      function stopTicking() {
        if (tickTimer !== null) {
          clearInterval(tickTimer);
          tickTimer = null;
        }
      }

      // ── Public API called from Java ────────────────────────────────────────

      window.WT = {
        /**
         * Loads a video and positions it. Called on session start and whenever the
         * synced videoId changes.
         *
         * Uses cueVideoById for the paused case so the video is buffered and shows a
         * poster frame without auto-starting, and loadVideoById for the playing case.
         */
        cue: function (videoId, posMs, playing, rate) {
          if (!videoId) return;
          // Remembered so handleError() can rebuild the embed and resume the same video at
          // the same position rather than losing the session to a transient failure.
          lastCue = { videoId: videoId, posMs: posMs, playing: playing, rate: rate };
          if (!ready || !player) {
            pending = lastCue;
            return;
          }
          // Ticking must be (re)started by every command that can resume playback, not
          // only by onReady. stop() clears the interval, and for a long time nothing ever
          // set it up again, so after the first session ended this page stopped reporting
          // positions for good. Java kept serving the last value it had received from
          // getLastKnownPositionMs(), which silently poisoned everything downstream: the
          // drift check compared a live target against a frozen local position, and the
          // heartbeat published that frozen position to the peer every 10s, dragging the
          // other device back to a timestamp from a previous video.
          startTicking();
          var seconds = Math.max(0, (posMs || 0) / 1000);
          if (playing) {
            safe(function () { player.loadVideoById({ videoId: videoId, startSeconds: seconds }); });
          } else {
            safe(function () { player.cueVideoById({ videoId: videoId, startSeconds: seconds }); });
          }
          if (rate && rate > 0) {
            safe(function () { player.setPlaybackRate(rate); });
          }
        },

        play: function () {
          if (ready && player) {
            startTicking();
            safe(function () { player.playVideo(); });
          }
        },

        pause: function () {
          // Keep ticking while paused: Java still needs a fresh position to seed the next
          // play/seek/rate write, and a paused position is cheap to read.
          if (ready && player) safe(function () { player.pauseVideo(); });
        },

        seek: function (posMs) {
          if (ready && player) {
            startTicking();
            var seconds = Math.max(0, (posMs || 0) / 1000);
            // allowSeekAhead=true so seeking past the buffer issues a new request.
            safe(function () { player.seekTo(seconds, true); });
          }
        },

        setRate: function (rate) {
          if (ready && player && rate > 0) {
            safe(function () { player.setPlaybackRate(rate); });
          }
        },

        stop: function () {
          stopTicking();
          if (ready && player) safe(function () { player.stopVideo(); });
        },

        /**
         * Sets the embed's volume, 0-100.
         *
         * WHY THIS EXISTS: the video plays underneath a live voice call. Without
         * attenuation the two audio sources compete at equal loudness and the
         * participants cannot hear each other over the video.
         *
         * Deliberately NOT implemented with Android audio focus. CallActivity holds
         * AUDIOFOCUS_GAIN and its focus-change listener responds to any loss by muting the
         * local microphone (callManager.setMuted(true)), only restoring it on
         * AUDIOFOCUS_GAIN. So requesting even transient focus from the Watch Together
         * screen would silence the user's own mic for the whole watch session. Lowering the
         * player's volume achieves the ducking intent with no focus transaction at all.
         *
         * Queued exactly like cue() when the player is not ready yet: Java applies the
         * initial attenuation as soon as it hears about onPlayerReady, but a race between
         * that callback and the first cue is cheap to close here rather than reason about.
         */
        setVolume: function (v) {
          var vol = Math.max(0, Math.min(100, Math.round(v || 0)));
          if (!ready || !player) {
            pendingVolume = vol;
            return;
          }
          safe(function () { player.setVolume(vol); });
        },

        mute: function () {
          if (!ready || !player) {
            pendingMuted = true;
            return;
          }
          safe(function () { player.mute(); });
        },

        unMute: function () {
          if (!ready || !player) {
            pendingMuted = false;
            return;
          }
          safe(function () { player.unMute(); });
        }
      };

      // ── YouTube IFrame API lifecycle ──────────────────────────────────────

      /**
       * Builds (or rebuilds) the embed.
       *
       * The `origin` / `widget_referrer` / `enablejsapi` trio is NOT optional and is the
       * reason this used to fail on almost every video. The page is served to the WebView
       * via loadDataWithBaseURL, so the iframe request carries no ordinary Referer header.
       * Without an explicit origin YouTube cannot attribute the embed to a permitted
       * referrer and answers with error 153 — "cannot be played in an embedded player" —
       * for videos that are in fact perfectly embeddable. Declaring the origin (matching
       * the WebView's base URL) makes the embed a first-class, attributable one and the
       * rejections stop.
       */
      function createPlayer() {
        var stage = document.getElementById('stage');
        // YT.Player replaces its target element with an iframe, so a rebuild needs a fresh
        // target rather than the consumed one.
        if (stage && !document.getElementById('player')) {
          stage.innerHTML = '<div id="player"></div>';
        }
        player = new YT.Player('player', {
          height: '100%',
          width: '100%',
          host: PLAYER_ORIGIN,
          playerVars: {
            // No YouTube chrome we do not need; playback is driven by DuoShield UI.
            autoplay: 0,
            controls: 0,
            disablekb: 1,
            modestbranding: 1,
            rel: 0,
            fs: 0,
            playsinline: 1,
            iv_load_policy: 3,
            // See createPlayer()'s javadoc: these three are what keep YouTube from
            // refusing embeddable videos with error 153 inside a WebView.
            enablejsapi: 1,
            origin: PLAYER_ORIGIN,
            widget_referrer: PLAYER_ORIGIN
          },
          events: {
            onReady: function () {
              ready = true;
              startTicking();

              // Applied BEFORE the pending cue below, so a queued video never gets to play
              // even one frame at full volume over the top of the call.
              if (pendingVolume !== null) {
                var v = pendingVolume;
                pendingVolume = null;
                window.WT.setVolume(v);
              }
              if (pendingMuted !== null) {
                var m = pendingMuted;
                pendingMuted = null;
                if (m) window.WT.mute(); else window.WT.unMute();
              }

              var b = bridge();
              if (b && b.onPlayerReady) safe(function () { b.onPlayerReady(); });
              if (pending) {
                var p = pending;
                pending = null;
                window.WT.cue(p.videoId, p.posMs, p.playing, p.rate);
              }
            },
            onStateChange: function (e) {
              var b = bridge();
              if (b && b.onPlayerStateChange) {
                safe(function () { b.onPlayerStateChange(e.data, positionMs()); });
              }
            },
            onPlaybackRateChange: function (e) {
              var b = bridge();
              if (b && b.onPlaybackRateChange) {
                safe(function () { b.onPlaybackRateChange(e.data); });
              }
            },
            onError: function (e) {
              handleError((e && typeof e.data === 'number') ? e.data : -1);
            }
          }
        });
      }

      /**
       * Absorbs the recoverable failures instead of surrendering the surface to Java.
       *
       * Codes 2 / 5 / 100 / 153 are all conditions a rebuilt embed routinely survives: a
       * request that raced the iframe's own initialization, an HTML5 player that came up
       * wrong, or an embed YouTube declined to attribute on the first attempt. The old
       * behaviour reported every one of them straight to Java, which latched the video as
       * permanently unplayable and told the user to pick a different one — for a video that
       * plays fine on the second try.
       *
       * One rebuild per video, then give up honestly. 101/150 (owner disallowed embedding)
       * is genuinely final and is reported immediately; retrying it would only stall the
       * user in front of a black rectangle.
       */
      function handleError(code) {
        var retryable = (code === 2 || code === 5 || code === 100 || code === 153);
        if (retryable && lastCue && retriedForVideoId !== lastCue.videoId) {
          retriedForVideoId = lastCue.videoId;
          var again = lastCue;
          ready = false;
          stopTicking();
          safe(function () { if (player && player.destroy) player.destroy(); });
          player = null;
          // Replayed by onReady, exactly like a cue that arrived before construction.
          pending = again;
          setTimeout(function () { safe(createPlayer); }, RETRY_DELAY_MS);
          return;
        }
        var b = bridge();
        if (b && b.onPlayerError) {
          safe(function () { b.onPlayerError(code); });
        }
      }

      window.onYouTubeIframeAPIReady = function () {
        createPlayer();
      };
    })();
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
