buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.6.0"
        classpath "com.google.gms:google-services:4.4.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // SC-06: JitPack builds artifacts on demand from mutable Git refs, so a
        // compromised or typo-squatted repo there could serve a malicious build
        // for ANY coordinate if JitPack is left unscoped in the repository list.
        // Restrict it to the only groups actually resolved from it
        // (`com.github.*`, e.g. com.github.chrisbanes:PhotoView) via a content
        // filter. Every other dependency — including all androidx/Firebase/Google
        // artifacts — can then only ever be served by google()/mavenCentral(),
        // which are declared first and are content-addressed. glide's real
        // coordinates live on Maven Central and resolve there (declared above),
        // so they never reach JitPack.
        maven {
            url 'https://jitpack.io'
            content {
                includeGroupByRegex 'com\\.github\\..*'
            }
        }
    }
}
