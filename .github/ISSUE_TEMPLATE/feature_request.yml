name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check whether a similar request already exists.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What use case does it address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've considered?

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Messaging
        - Encryption / security
        - Media
        - Group chats
        - Notifications
        - UI / UX
        - Performance
        - CI / build
        - Other
    validations:
      required: true
