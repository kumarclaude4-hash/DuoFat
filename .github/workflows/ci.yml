name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — using stub for lint."
            cat app/google-services.json.template > app/google-services.json
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --continue

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: warn
          retention-days: 14

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — using stub."
            cat app/google-services.json.template > app/google-services.json
          fi

      # SC-02: no B2 credential is exposed to this job. It previously mapped
      # secrets.B2_KEY_ID / B2_APPLICATION_KEY into the environment and wrote
      # them to local.properties, even though a debug build never uses them —
      # the client obtains per-object capability tokens from the push server
      # instead (SEC-A01).
      #
      # This job runs on pull requests, so its exposure surface is much wider
      # than the release job's: every CI run pulled the live storage master
      # credential into a runner, a Gradle daemon, and the build cache in order
      # to compile code that ignores it. Non-secret routing values only.
      - name: Write local.properties (non-secret values only)
        env:
          B2_BUCKET:       ${{ secrets.B2_BUCKET }}
          B2_REGION:       ${{ secrets.B2_REGION }}
          PUSH_SERVER_URL: ${{ secrets.PUSH_SERVER_URL }}
          WORKER_URL:      ${{ secrets.WORKER_URL }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"                                                     > local.properties
          echo "b2.bucket=${B2_BUCKET:-duoshield-cold}"                                       >> local.properties
          echo "b2.region=${B2_REGION:-eu-central-003}"                                       >> local.properties
          echo "push.server.url=${PUSH_SERVER_URL:-https://duofat.onrender.com}"              >> local.properties
          echo "worker.url=${WORKER_URL:-https://duoshield-storage.kumarclaude4.workers.dev}" >> local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoShield-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  instrumented-tests:
    name: Instrumented tests (Espresso)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — using stub."
            cat app/google-services.json.template > app/google-services.json
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Instrumented tests need a real (emulated) device. GitHub-hosted Ubuntu
      # runners have nested-virtualization hardware but KVM access is disabled
      # by default — this is the standard enablement snippet recommended by
      # reactivecircus/android-emulator-runner for Linux runners.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator needs the command-line tools on PATH so the runner action
      # can invoke avdmanager/sdkmanager/emulator. Without this the action can
      # fail to provision the AVD and then time out waiting on a device that
      # was never created ("No compatible devices connected").
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AVD snapshot cache. The cache is only restored on an exact key hit, so
      # the key must encode every AVD-defining property (api-level, target,
      # arch). A stale/partial restore is worse than no cache: the runner is
      # then told an AVD exists (force-avd-creation: false) when the snapshot
      # is unusable, which surfaces as
      # "Failed to start Emulator console for 5554".
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-aosp_atd-x86_64-v2

      # Create the AVD once and snapshot it, WITHOUT running any test. This
      # separates "provision the device" from "run the tests", so a
      # provisioning failure is reported as a provisioning failure instead of
      # as a mysterious test-task error. Runs only on a cache miss.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # api-level/target/arch/profile MUST match the snapshot step above,
          # or the cached AVD does not apply to this run.
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Prove a device is actually present and finished booting BEFORE
          # handing control to Gradle. If this fails the job fails here with a
          # clear device-level cause, rather than inside the test task.
          script: |
            adb devices
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            adb shell getprop ro.build.version.sdk
            ./gradlew :app:connectedDebugAndroidTest --no-daemon

      # Fail the job if the test task "succeeded" without actually executing any
      # test. connectedDebugAndroidTest can exit 0 on an empty run, which would
      # otherwise show up as a green Espresso job that tested nothing.
      - name: Verify Espresso tests actually executed
        if: always()
        run: |
          RESULTS_DIR=app/build/outputs/androidTest-results/connected
          if [ ! -d "$RESULTS_DIR" ]; then
            echo "::error::No instrumentation results directory — tests did not run."
            exit 1
          fi
          TOTAL=$(grep -ho 'tests="[0-9]*"' "$RESULTS_DIR"/*.xml 2>/dev/null \
                  | grep -o '[0-9]*' | paste -sd+ - | bc)
          TOTAL=${TOTAL:-0}
          echo "Espresso tests executed: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Instrumentation ran 0 tests — treating as failure."
            exit 1
          fi

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
