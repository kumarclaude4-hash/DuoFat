name: Firestore Rules Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
  workflow_dispatch:

jobs:
  rules-test:
    name: Test Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (required by Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install test dependencies
        working-directory: firestore-tests
        run: npm install

      - name: Start Firestore emulator and run tests
        working-directory: firestore-tests
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
        run: |
          firebase emulators:exec \
            --only firestore \
            --project duoshield-test \
            "npm test" \
            2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-test-results
          path: firestore-tests/junit.xml
          if-no-files-found: ignore
          retention-days: 14
