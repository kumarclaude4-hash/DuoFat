name: Firestore rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
  workflow_dispatch:

jobs:
  rules-test:
    name: Security rules unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21 (required by Firebase emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.26.0

      - name: Install test dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Run rules tests against Firestore emulator
        working-directory: firestore-tests
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
        run: |
          firebase emulators:exec \
            --only firestore \
            --project duoshield-test \
            "npm test" 2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-rules-test-results
          path: firestore-tests/junit.xml
          if-no-files-found: ignore
          retention-days: 14
